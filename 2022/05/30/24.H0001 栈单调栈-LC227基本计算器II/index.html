4 / 2&quot;</span>;<span class="comment">//5</span></span><br><span class="line">		<span class="type">int</span> <span class="variable">result</span> <span class="operator">=</span> obj.calculate(s);</span><br><span class="line">		System.out.println(result);</span><br><span class="line">	}</span><br><span class="line"></span><br><span class="line">    <span class="comment">//&#x601D;&#x8DEF;&#x53C2;&#x8003;&#x5B98;&#x65B9;&#x9898;&#x89E3;&#xFF1A;https://leetcode.cn/problems/basic-calculator-ii/solutions/648647/ji-ben-ji-suan-qi-ii-by-leetcode-solutio-cm28/</span></span><br><span class="line">    <span class="comment">//&#x4EE3;&#x7801;&#x53C2;&#x8003;&#xFF1A; &#x7231;&#x5B66;&#x4E60;&#x7684;&#x7C89;&#x5237;&#x5320;</span></span><br><span class="line">	<span class="comment">/**</span></span><br><span class="line"><span class="comment">	&#x601D;&#x8DEF;</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">	&#x7531;&#x4E8E;&#x4E58;&#x9664;&#x4F18;&#x5148;&#x4E8E;&#x52A0;&#x51CF;&#x8BA1;&#x7B97;&#xFF0C;&#x56E0;&#x6B64;&#x4E0D;&#x59A8;&#x8003;&#x8651;&#x5148;&#x8FDB;&#x884C;&#x6240;&#x6709;&#x4E58;&#x9664;&#x8FD0;&#x7B97;&#xFF0C;&#x5E76;&#x5C06;&#x8FD9;&#x4E9B;&#x4E58;&#x9664;&#x8FD0;&#x7B97;&#x540E;&#x7684;&#x6574;&#x6570;&#x503C;&#x653E;&#x56DE;&#x539F;&#x8868;&#x8FBE;&#x5F0F;&#x7684;&#x76F8;&#x5E94;&#x4F4D;&#x7F6E;&#xFF0C;&#x5219;&#x968F;&#x540E;&#x6574;&#x4E2A;&#x8868;&#x8FBE;&#x5F0F;&#x7684;&#x503C;&#xFF0C;&#x5C31;&#x7B49;&#x4E8E;&#x4E00;&#x7CFB;&#x5217;&#x6574;&#x6570;&#x52A0;&#x51CF;&#x540E;&#x7684;&#x503C;&#x3002;</span></span><br><span class="line"><span class="comment">	&#x57FA;&#x4E8E;&#x6B64;&#xFF0C;&#x6211;&#x4EEC;&#x53EF;&#x4EE5;&#x7528;&#x4E00;&#x4E2A;&#x6808;&#xFF0C;&#x4FDD;&#x5B58;&#x8FD9;&#x4E9B;&#xFF08;&#x8FDB;&#x884C;&#x4E58;&#x9664;&#x8FD0;&#x7B97;&#x540E;&#x7684;&#xFF09;&#x6574;&#x6570;&#x7684;&#x503C;&#x3002;&#x5BF9;&#x4E8E;&#x52A0;&#x51CF;&#x53F7;&#x540E;&#x7684;&#x6570;&#x5B57;&#xFF0C;&#x5C06;&#x5176;&#x76F4;&#x63A5;&#x538B;&#x5165;&#x6808;&#x4E2D;&#xFF1B;&#x5BF9;&#x4E8E;&#x4E58;&#x9664;&#x53F7;&#x540E;&#x7684;&#x6570;&#x5B57;&#xFF0C;&#x53EF;&#x4EE5;&#x76F4;&#x63A5;&#x4E0E;&#x6808;&#x9876;&#x5143;&#x7D20;&#x8BA1;&#x7B97;&#xFF0C;&#x5E76;&#x66FF;&#x6362;&#x6808;&#x9876;&#x5143;&#x7D20;&#x4E3A;&#x8BA1;&#x7B97;&#x540E;&#x7684;&#x7ED3;&#x679C;&#x3002;</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">	&#x5177;&#x4F53;&#x6765;&#x8BF4;&#xFF0C;&#x904D;&#x5386;&#x5B57;&#x7B26;&#x4E32; s&#xFF0C;&#x5E76;&#x7528;&#x53D8;&#x91CF; preSign &#x8BB0;&#x5F55;&#x6BCF;&#x4E2A;&#x6570;&#x5B57;&#x4E4B;&#x524D;&#x7684;&#x8FD0;&#x7B97;&#x7B26;&#xFF0C;&#x5BF9;&#x4E8E;&#x7B2C;&#x4E00;&#x4E2A;&#x6570;&#x5B57;&#xFF0C;&#x5176;&#x4E4B;&#x524D;&#x7684;&#x8FD0;&#x7B97;&#x7B26;&#x89C6;&#x4E3A;&#x52A0;&#x53F7;&#x3002;&#x6BCF;&#x6B21;&#x904D;&#x5386;&#x5230;&#x6570;&#x5B57;&#x672B;&#x5C3E;&#x65F6;&#xFF0C;&#x6839;&#x636E; preSign &#x6765;&#x51B3;&#x5B9A;&#x8BA1;&#x7B97;&#x65B9;&#x5F0F;&#xFF1A;</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">	&#x52A0;&#x53F7;&#xFF1A;&#x5C06;&#x6570;&#x5B57;&#x538B;&#x5165;&#x6808;&#xFF1B;</span></span><br><span class="line"><span class="comment">	&#x51CF;&#x53F7;&#xFF1A;&#x5C06;&#x6570;&#x5B57;&#x7684;&#x76F8;&#x53CD;&#x6570;&#x538B;&#x5165;&#x6808;&#xFF1B;</span></span><br><span class="line"><span class="comment">	&#x4E58;&#x9664;&#x53F7;&#xFF1A;&#x8BA1;&#x7B97;&#x6570;&#x5B57;&#x4E0E;&#x6808;&#x9876;&#x5143;&#x7D20;&#xFF0C;&#x5E76;&#x5C06;&#x6808;&#x9876;&#x5143;&#x7D20;&#x66FF;&#x6362;&#x4E3A;&#x8BA1;&#x7B97;&#x7ED3;&#x679C;&#x3002;</span></span><br><span class="line"><span class="comment">	&#x4EE3;&#x7801;&#x5B9E;&#x73B0;&#x4E2D;&#xFF0C;&#x82E5;&#x8BFB;&#x5230;&#x4E00;&#x4E2A;&#x8FD0;&#x7B97;&#x7B26;&#xFF0C;&#x6216;&#x8005;&#x904D;&#x5386;&#x5230;&#x5B57;&#x7B26;&#x4E32;&#x672B;&#x5C3E;&#xFF0C;&#x5373;&#x8BA4;&#x4E3A;&#x662F;&#x904D;&#x5386;&#x5230;&#x4E86;&#x6570;&#x5B57;&#x672B;&#x5C3E;&#x3002;&#x5904;&#x7406;&#x5B8C;&#x8BE5;&#x6570;&#x5B57;&#x540E;&#xFF0C;&#x66F4;&#x65B0; preSign &#x4E3A;&#x5F53;&#x524D;&#x904D;&#x5386;&#x7684;&#x5B57;&#x7B26;&#x3002;</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">	&#x904D;&#x5386;&#x5B8C;&#x5B57;&#x7B26;&#x4E32; s &#x540E;&#xFF0C;&#x5C06;&#x6808;&#x4E2D;&#x5143;&#x7D20;&#x7D2F;&#x52A0;&#xFF0C;&#x5373;&#x4E3A;&#x8BE5;&#x5B57;&#x7B26;&#x4E32;&#x8868;&#x8FBE;&#x5F0F;&#x7684;&#x503C;&#x3002;</span></span><br><span class="line"><span class="comment">     */</span></span><br><span class="line">	<span class="comment">// &#x80CC;&#x8FD9;&#x4E2A;&#x7248;&#x672C;&#x7684;</span></span><br><span class="line">	<span class="keyword">public</span> <span class="type">int</span> <span class="title function_">calculate</span><span class="params">(String s)</span> {</span><br><span class="line">		<span class="keyword">if</span> (s == <span class="literal">null</span> || s.length() == <span class="number">0</span>) {</span><br><span class="line">			<span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">		}</span><br><span class="line"></span><br><span class="line">		Stack&lt;Integer&gt; valStack = <span class="keyword">new</span> <span class="title class_">Stack</span>&lt;Integer&gt;();</span><br><span class="line">		<span class="type">char</span> <span class="variable">op</span> <span class="operator">=</span> <span class="string">&apos;+&apos;</span>;</span><br><span class="line">		<span class="type">char</span>[] chars = s.toCharArray();</span><br><span class="line">		<span class="keyword">for</span> (<span class="type">int</span> <span class="variable">i</span> <span class="operator">=</span> <span class="number">0</span>; i &lt; chars.length; i++) {</span><br><span class="line"></span><br><span class="line">			<span class="keyword">if</span> (chars[i] == <span class="string">&apos; &apos;</span>) {</span><br><span class="line">				<span class="keyword">continue</span>;</span><br><span class="line">			}</span><br><span class="line"></span><br><span class="line">			<span class="keyword">if</span> (Character.isDigit(chars[i])) {</span><br><span class="line">				<span class="type">int</span> <span class="variable">num</span> <span class="operator">=</span> <span class="number">0</span>;</span><br><span class="line">				<span class="keyword">while</span> (i &lt; chars.length &amp;&amp; Character.isDigit(chars[i])) {</span><br><span class="line">					num = num * <span class="number">10</span> + (chars[i] - <span class="string">&apos;0&apos;</span>);</span><br><span class="line">					i++;</span><br><span class="line">				}</span><br><span class="line">				i--;</span><br><span class="line"></span><br><span class="line">				<span class="keyword">switch</span> (op) {</span><br><span class="line">					<span class="keyword">case</span> <span class="string">&apos;+&apos;</span>:</span><br><span class="line">						valStack.push(num);</span><br><span class="line">						<span class="keyword">break</span>;</span><br><span class="line">					<span class="keyword">case</span> <span class="string">&apos;-&apos;</span>:</span><br><span class="line">						valStack.push(-num);</span><br><span class="line">						<span class="keyword">break</span>;</span><br><span class="line">					<span class="keyword">case</span> <span class="string">&apos;*&apos;</span>:</span><br><span class="line">						<span class="type">Integer</span> <span class="variable">topNum1</span> <span class="operator">=</span> valStack.pop();</span><br><span class="line">						valStack.push(num * topNum1);</span><br><span class="line">						<span class="keyword">break</span>;</span><br><span class="line">					<span class="keyword">case</span> <span class="string">&apos;/&apos;</span>:</span><br><span class="line">						<span class="type">Integer</span> <span class="variable">topNum2</span> <span class="operator">=</span> valStack.pop();</span><br><span class="line">						valStack.push(topNum2 / num);</span><br><span class="line">						<span class="keyword">break</span>;</span><br><span class="line">				}</span><br><span class="line">			} <span class="keyword">else</span> {</span><br><span class="line">				op = chars[i];</span><br><span class="line">			}</span><br><span class="line">		}</span><br><span class="line"></span><br><span class="line">		<span class="type">int</span> <span class="variable">res</span> <span class="operator">=</span> <span class="number">0</span>;</span><br><span class="line">		<span class="keyword">while</span> (!valStack.isEmpty()) {</span><br><span class="line">			res += valStack.pop();</span><br><span class="line">		}</span><br><span class="line">		<span class="keyword">return</span> res;</span><br><span class="line">	}</span><br><span class="line">}</span><br></pre></td></tr></table></figure>

<script>
    function viewer_init() {
        let pswpElement = document.querySelectorAll('.pswp')[0];
        let $imgArr = document.querySelectorAll(('.article-entry img:not(.reward-img)'))

        $imgArr.forEach(($em, i) => {
            $em.onclick = () => {
                // slider展开状态
                // todo: 这样不好，后面改成状态
                if (document.querySelector('.left-col.show')) return
                let items = []
                $imgArr.forEach(($em2, i2) => {
                    let img = $em2.getAttribute('data-idx', i2)
                    let src = $em2.getAttribute('data-target') || $em2.getAttribute('src')
                    let title = $em2.getAttribute('alt')
                    // 获得原图尺寸
                    const image = new Image()
                    image.src = src
                    items.push({
                        src: src,
                        w: image.width || $em2.width,
                        h: image.height || $em2.height,
                        title: title
                    })
                })
                var gallery = new PhotoSwipe(pswpElement, PhotoSwipeUI_Default, items, {
                    index: parseInt(i)
                });
                gallery.init()
            }
        })
    }
    viewer_init()
</script>

<!-- CodeCopy -->
 
<link rel="stylesheet" href="/css/clipboard.css">
 <script src="https://cdn.staticfile.org/clipboard.js/2.0.10/clipboard.min.js"></script>
<script>
  function wait(callback, seconds) {
    var timelag = null;
    timelag = window.setTimeout(callback, seconds);
  }
  !function (e, t, a) {
    var initCopyCode = function(){
      var copyHtml = '';
      copyHtml += '<button class="btn-copy" data-clipboard-snippet="">';
      copyHtml += '<i class="ri-file-copy-2-line"></i><span>COPY</span>';
      copyHtml += '</button>';
      $(".highlight .code pre").before(copyHtml);
      $(".article pre code").before(copyHtml);
      var clipboard = new ClipboardJS('.btn-copy', {
        target: function(trigger) {
          return trigger.nextElementSibling;
        }
      });
      clipboard.on('success', function(e) {
        let $btn = $(e.trigger);
        $btn.addClass('copied');
        let $icon = $($btn.find('i'));
        $icon.removeClass('ri-file-copy-2-line');
        $icon.addClass('ri-checkbox-circle-line');
        let $span = $($btn.find('span'));
        $span[0].innerText = 'COPIED';
        
        wait(function () { // 等待两秒钟后恢复
          $icon.removeClass('ri-checkbox-circle-line');
          $icon.addClass('ri-file-copy-2-line');
          $span[0].innerText = 'COPY';
        }, 2000);
      });
      clipboard.on('error', function(e) {
        e.clearSelection();
        let $btn = $(e.trigger);
        $btn.addClass('copy-failed');
        let $icon = $($btn.find('i'));
        $icon.removeClass('ri-file-copy-2-line');
        $icon.addClass('ri-time-line');
        let $span = $($btn.find('span'));
        $span[0].innerText = 'COPY FAILED';
        
        wait(function () { // 等待两秒钟后恢复
          $icon.removeClass('ri-time-line');
          $icon.addClass('ri-file-copy-2-line');
          $span[0].innerText = 'COPY';
        }, 2000);
      });
    }
    initCopyCode();
  }(window, document);
</script>
